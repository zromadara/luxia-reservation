
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Réservation – Luxia Résidence</title>
  <style>
    body { font-family: sans-serif; padding: 30px; max-width: 600px; margin: auto; }
    h1 { color: #c9a76d; }
    input, select, textarea, button {
      width: 100%; padding: 10px; margin: 10px 0;
      border: 1px solid #ccc; border-radius: 6px;
    }
    button { background-color: #c9a76d; color: white; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Réserver un séjour</h1>
  <form action="/reserver" method="POST">
    <input name="nom" placeholder="Nom complet" required />
    <input name="email" type="email" placeholder="E-mail" required />
    <input name="telephone" placeholder="Téléphone" />
    <select name="type" required>
      <option value="">Type de logement</option>
      <option value="Vue mer">Vue mer</option>
      <option value="Standard">Standard</option>
    </select>
    <input name="date_arrivee" type="date" required />
    <input name="date_depart" type="date" required />
    <textarea name="message" placeholder="Message..." rows="4"></textarea>
    <button type="submit">Envoyer</button>
  </form>
</body>
</html>
